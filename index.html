<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo DPPP | Libro Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="header">
    <img src="pages/Logo.png" class="logo" alt="Logo MSP">
    <div class="subtitle">PORTAFOLIO DE SERVICIOS DPPP</div>
  </header>

  <main class="viewer">
    <button class="nav left" id="prevBtn">‹</button>

    <section class="book" id="book">
      <div class="page left-page">
        <img id="leftImg" src="pages/Pagina-01.jpeg" alt="Página izquierda">
      </div>

      <div class="spine"></div>

      <div class="page right-page">
        <img id="rightImg" src="pages/Pagina-02.jpeg" alt="Página derecha">
      </div>
    </section>

    <button class="nav right" id="nextBtn">›</button>
  </main>

  <section class="controls">
    <button id="firstBtn">Inicio</button>
    <button id="fullscreenBtn">Pantalla completa</button>
    <span id="counter">Páginas 1 - 2 / 21</span>
  </section>

  <script src="script.js"></script>
</body>
</html>

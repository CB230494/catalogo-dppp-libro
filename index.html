<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo DPPP | Flipbook</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <img src="pages/Logo.png" class="logo" alt="Ministerio de Seguridad Pública">
    <h1>Catálogo DE SERVICIOS DPPP</h1>
  </header>

  <main class="main-viewer">

    <button id="prevBtn" class="nav-btn left">‹</button>

    <section class="book-area">
      <div id="flipbook">
        <div class="page"><img src="pages/Pagina-01.jpeg" alt="Página 1"></div>
        <div class="page"><img src="pages/Pagina-02.jpeg" alt="Página 2"></div>
        <div class="page"><img src="pages/Pagina-03.jpeg" alt="Página 3"></div>
        <div class="page"><img src="pages/Pagina-04.jpeg" alt="Página 4"></div>
        <div class="page"><img src="pages/Pagina-05.jpeg" alt="Página 5"></div>
        <div class="page"><img src="pages/Pagina-06.jpeg" alt="Página 6"></div>
        <div class="page"><img src="pages/Pagina-07.jpeg" alt="Página 7"></div>
        <div class="page"><img src="pages/Pagina-08.jpeg" alt="Página 8"></div>
        <div class="page"><img src="pages/Pagina-09.jpeg" alt="Página 9"></div>
        <div class="page"><img src="pages/Pagina-10.jpeg" alt="Página 10"></div>
        <div class="page"><img src="pages/Pagina-11.jpeg" alt="Página 11"></div>
        <div class="page"><img src="pages/Pagina-12.jpeg" alt="Página 12"></div>
        <div class="page"><img src="pages/Pagina-13.jpeg" alt="Página 13"></div>
        <div class="page"><img src="pages/Pagina-14.jpeg" alt="Página 14"></div>
        <div class="page"><img src="pages/Pagina-15.jpeg" alt="Página 15"></div>
        <div class="page"><img src="pages/Pagina-16.jpeg" alt="Página 16"></div>
        <div class="page"><img src="pages/Pagina-17.jpeg" alt="Página 17"></div>
        <div class="page"><img src="pages/Pagina-18.jpeg" alt="Página 18"></div>
        <div class="page"><img src="pages/Pagina-19.jpeg" alt="Página 19"></div>
        <div class="page"><img src="pages/Pagina-20.jpeg" alt="Página 20"></div>
        <div class="page"><img src="pages/Pagina-21.jpeg" alt="Página 21"></div>
      </div>
    </section>

    <button id="nextBtn" class="nav-btn right">›</button>

  </main>

  <section class="controls">
    <button id="firstBtn">Inicio</button>
    <button id="fullscreenBtn">Pantalla completa</button>
    <span id="counter">Página 1 / 21</span>
  </section>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/blasten/turn.js@master/turn.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
